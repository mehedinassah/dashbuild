{% extends "products/base.html" %}
{% block content %}
<h1>Products</h1>
<form method="get">
  <input type="text" name="q" value="{{ q }}" placeholder="Search">
  <button type="submit">Search</button>
  <a href="{% url "products:create" %}">Add new</a>
</form>
<table>
  <thead><tr><th>Name</th><th>Sku</th><th>Price</th><th>Stock</th><th></th></tr></thead>
  <tbody>
  {% for item in items %}
    <tr><td>{{ item.name }}</td><td>{{ item.sku }}</td><td>{{ item.price }}</td><td>{{ item.stock }}</td><td><a href="{% url "products:update" item.pk %}">Edit</a> <a href="{% url "products:delete" item.pk %}">Delete</a></td></tr>
  {% empty %}
    <tr><td colspan="5">Nothing here yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
