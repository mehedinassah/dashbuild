{% extends "sales/base.html" %}
{% block content %}
<h1>Sales</h1>
<form method="get" class="toolbar">
  <input type="text" name="q" value="{{ q }}" placeholder="Search">
  <button type="submit" class="btn secondary">Search</button>
  <a class="btn" href="{% url "sales:create" %}">+ Add new</a>
</form>
<table>
  <thead><tr><th>Number</th><th>Date</th><th>Customer</th><th>Total</th><th></th></tr></thead>
  <tbody>
  {% for item in items %}
    <tr><td>{{ item.number }}</td><td>{{ item.date }}</td><td>{{ item.customer }}</td><td>{{ item.total }}</td><td class="actions"><a href="{% url "sales:update" item.pk %}">Edit</a> <a class="danger-link" href="{% url "sales:delete" item.pk %}">Delete</a></td></tr>
  {% empty %}
    <tr><td colspan="5">Nothing here yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
