{% extends "core/base.html" %}
{% block title %}Customers{% endblock %}
{% block content %}
<h1>Customers</h1>
<form method="get" class="toolbar">
  <input type="text" name="q" value="{{ q }}" placeholder="Search by name">
  <button type="submit" class="btn secondary">Search</button>
  <a class="btn" href="/admin/customers/customer/add/">+ Add in admin</a>
</form>
<table>
  <thead><tr><th>Name</th><th>Email</th><th>Phone</th></tr></thead>
  <tbody>
    {% for customer in customers %}
    <tr><td>{{ customer.name }}</td><td>{{ customer.email }}</td><td>{{ customer.phone }}</td></tr>
    {% empty %}
    <tr><td colspan="3">Nothing here yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
